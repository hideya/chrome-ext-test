<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Window Color Manager</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="color-selection">
      <div class="color-palette">
        <div class="color-option" data-color="oklch(63.7% 0.237 25.331)" style="background: oklch(63.7% 0.237 25.331);" title="red"></div>
        <div class="color-option" data-color="oklch(76.9% 0.188 70.08)" style="background: oklch(76.9% 0.188 70.08);" title="amber"></div>
        <div class="color-option" data-color="oklch(76.8% 0.233 130.85)" style="background: oklch(76.8% 0.233 130.85);" title="lime"></div>
        <div class="color-option" data-color="oklch(69.6% 0.17 162.48)" style="background: oklch(69.6% 0.17 162.48);" title="emerald"></div>
        <div class="color-option" data-color="oklch(71.5% 0.143 215.221)" style="background: oklch(71.5% 0.143 215.221);" title="cyan"></div>
        <div class="color-option" data-color="oklch(62.3% 0.214 259.815)" style="background: oklch(62.3% 0.214 259.815);" title="blue"></div>
        <div class="color-option" data-color="oklch(62.7% 0.265 303.9)" style="background: oklch(62.7% 0.265 303.9);" title="purple"></div>
        <div id="removeColor" class="remove-option" title="色を削除">×</div>
      </div>
    </div>
    
    <!-- 設定ボタン -->
    <div class="settings-button" id="settingsButton" title="拡張機能を管理">⚙️</div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
